  - .github/workflows/01-goal-intake.yml
  - .github/workflows/03-pr-validation.yml
  - .github/workflows/04-auto-merge.yml
  - .github/workflows/06-reconciler.yml
  - .github/workflows/07-content-schedule.yml
  - .github/workflows/08-netlify-status.yml
  - .github/ISSUE_TEMPLATE/**
  - .github/pull_request_template.md
  - ops/schemas/**
  - package.json
  - package-lock.json
  - netlify.toml
  - src/**
  - content/**
  forbidden_actions:
  - Enable AUTOMATION_ENABLED.
  - Enable CONTENT_AUTOMATION_ENABLED.
  - Modify Secrets or expose credentials.
  - Change Netlify site configuration.
  - Bypass Pull Request validation.
  - Directly push Jules-generated work to main.
  - Delete existing tests or weaken validation gates.
  validation_commands:
  - npm run validate:schemas
  - npm run validate:task-graph
  - npm run typecheck
  - npm run build
  - npm run ci
  - git diff --check
