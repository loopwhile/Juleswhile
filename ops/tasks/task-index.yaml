  - ops/scripts/reconcile-project.ts
  - ops/scripts/jules-api.ts
  - ops/scripts/jules-api.test.ts
  - ops/scripts/reconcile-project.test.ts
  - ops/scripts/verify-repository-integrity.ts
  - ops/scripts/verify-repository-integrity.test.ts
