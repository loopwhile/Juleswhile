  title: Reconcile runtime state with Jules API sessions
  role: developer
  type: bug-fix
  status: COMPLETED
  priority: P0
  enabled: false
  objective: Change the Reconciler to verify real Jules REST API Session state before recovering
    runtime TASK state, while preserving TASK-003 quota ledger and dispatch intent evidence.
  depends_on:
