  - .github/workflows/06-reconciler.yml
  - ops/tasks/task-index.yaml
  - ops/state/project-state.json
  - package.json
  acceptance_criteria:
  - Reconciler queries Jules REST API Sessions with JULES_API_KEY and never logs API keys,
    request headers, or full prompts.
  - JULES_API_BASE_URL can override the default base URL for tests.
  - API client applies request timeout and distinguishes auth, not found, rate limit, server,
    timeout, network, and invalid response failures.
  - Existing TASK-003 quota ledger, dispatch intent, dispatch outcome, and task-dispatch markers
    remain backward compatible.
  - Issue comments are read with pagination beyond the first 100 comments.
  - Stale RUNNING TASKs are not moved to RETRY_WAIT without Jules API state evidence.
  - COMPLETED Sessions with a traceable repository Pull Request are moved to PR tracking state.
  - COMPLETED Sessions without a traceable Pull Request are BLOCKED with an Incident.
  - Human-intervention Session states are BLOCKED with idempotent Incident markers.
  - FAILED Sessions move to RETRY_WAIT or BLOCKED according to correction limits.
  - Missing, ambiguous, transient API-error, and unknown Session states do not create new Jules
    Sessions automatically.
  - Dry-run does not mutate GitHub state and includes API observations in the JSON report.
