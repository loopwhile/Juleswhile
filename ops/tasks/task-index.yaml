  title: Complete TASK only after production deployment
  role: developer
  type: bug-fix
  status: COMPLETED
  priority: P0
  enabled: false
  objective: Change TASK completion from merge-time completion to production deployment verified
    completion, while preserving exactly one state label and delaying next-TASK evaluation.
  depends_on:
