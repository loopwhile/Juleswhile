tasks:
  - kind: task
    id: TASK-015
    title: Modularize selector, dispatcher and task lifecycle controllers
    role: solution-architect
    type: refactoring
    status: COMPLETED
    priority: P0
    enabled: false
    objective: Split TASK selection, Jules dispatch, Issue materialization, TASK state transition and TASK graph validation into explicit Domain, Application, Ports, Infrastructure and Entrypoint modules while removing every TASK-015 source-size exception without changing Runtime behavior.
    depends_on:
      - TASK-014
    inputs:
      - docs/04_architecture/architecture-baseline.md
      - ops/config/source-size-baseline.json
      - ops/scripts/dispatch-jules.ts
