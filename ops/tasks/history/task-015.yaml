      - package.json
      - tsconfig.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-015.yaml
      - ops/state/project-state.json
    forbidden_paths:
      - src/**
      - content/**
      - public/**
      - docs/**
      - .github/workflows/**
      - ops/tasks/task-history.yaml
      - ops/tasks/task-templates.yaml
    forbidden_actions:
      - Do not change TASK selection or priority semantics.
      - Do not change dependency, Resource Lock or concurrency semantics.
      - Do not change Quota budgets or consumption rules.
      - Do not change Jules Session creation or idempotency contracts.
      - Do not change GitHub Issue materialization or lifecycle semantics.
      - Do not change Workflow triggers, permissions or action pins.
      - Do not add or increase a Source Size exception.
      - Do not push directly to main.
      - Do not merge without exact-head validation evidence.
    validation_commands:
      - npm run validate:schemas
      - npm run validate:task-graph
      - npm run validate:source-size
      - npm run lint
      - npm run typecheck
      - npm run test:unit
      - npm run build
      - npm run ci
      - git diff --check
    risk_level: high
