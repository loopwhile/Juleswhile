      - ops/scripts/select-next-task.test.ts
      - ops/scripts/materialize-issues.ts
      - ops/scripts/materialize-issues.test.ts
      - ops/scripts/task-state-transition.ts
      - ops/scripts/task-state-transition.test.ts
      - ops/scripts/validate-task-graph.ts
      - ops/scripts/validate-task-graph.test.ts
      - ops/scripts/task-manifest.ts
      - package.json
      - tsconfig.json
    outputs:
      - ops/domain/**
      - ops/application/**
      - ops/ports/**
      - ops/infrastructure/github/**
      - ops/infrastructure/jules/**
      - ops/infrastructure/filesystem/**
      - ops/scripts/dispatch-jules*.ts
      - ops/scripts/select-next-task*.ts
      - ops/scripts/materialize-issues*.ts
      - ops/scripts/task-state-transition*.ts
      - ops/scripts/validate-task-graph*.ts
      - ops/scripts/source-size-validator.test.ts
      - ops/config/source-size-baseline.json
      - package.json
      - tsconfig.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-015.yaml
      - ops/state/project-state.json
    acceptance_criteria:
      - Separate TASK eligibility, dependency, priority, Resource Lock and concurrency policies.
      - Separate Quota policy, Dispatch Intent, Jules Session idempotency and Session atomicity.
      - Separate GitHub Issue, Jules Session and filesystem adapters from Application orchestration.
      - Separate TASK Issue Materialization and TASK state-transition use cases.
      - Separate TASK Graph, Manifest and PR Scope validation policies.
      - Keep existing scripts as thin CLI Entrypoints.
      - Keep every new or modified TASK-015 TypeScript file at or below 500 lines.
      - Remove all five TASK-015 entries from the Source Size Baseline.
      - Preserve existing CLI flags, output files, exit codes and Runtime behavior.
      - Preserve GitHub, Jules and TASK Manifest external contracts.
      - Pass schema, task graph, source-size, lint, typecheck, unit, build and full CI validation.
      - Synchronize TASK-015 registration into committed Project State through Runtime Projection.
    allowed_paths:
      - ops/domain/**
      - ops/application/**
      - ops/ports/**
      - ops/infrastructure/github/**
      - ops/infrastructure/jules/**
      - ops/infrastructure/filesystem/**
