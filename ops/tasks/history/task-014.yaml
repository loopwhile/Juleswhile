tasks:
  - kind: task
    id: TASK-014
    title: Modularize runtime projection and reconciler
    role: solution-architect
    type: refactoring
    status: DEPLOYING
    priority: P0
    enabled: true
    objective: Split Runtime Projection and Reconciler responsibilities into explicit Domain, Application, Infrastructure and Entrypoint modules while removing every TASK-014 source-size exception without changing Runtime behavior.
    depends_on:
      - TASK-013
    inputs:
      - docs/04_architecture/architecture-baseline.md
      - ops/config/source-size-baseline.json
      - ops/scripts/project-state-projection.ts
      - ops/scripts/project-state-projection.test.ts
      - ops/scripts/rebuild-project-state.ts
      - ops/scripts/reconcile-project.ts
      - ops/scripts/reconcile-project.test.ts
      - package.json
    outputs:
      - ops/application/**
      - ops/domain/projection/**
      - ops/domain/reconciliation/**
      - ops/infrastructure/github/**
      - ops/scripts/project-state-projection*.ts
      - ops/scripts/rebuild-project-state.ts
      - ops/scripts/reconcile-project*.ts
      - ops/scripts/source-size-validator.test.ts
      - ops/config/source-size-baseline.json
      - package.json
      - tsconfig.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-014.yaml
      - ops/state/project-state.json
    acceptance_criteria:
      - Separate Projection contracts, status policy, Session evidence, quota projection, evidence digest and application projection.
      - Separate Reconciliation contracts, policy, CLI parsing, Runtime evidence parsing and GitHub adapters.
      - Separate Jules Session reconciliation, duplicate TASK handling, open TASK handling and scheduling policy.
      - Keep reconcile-project.ts and rebuild-project-state.ts as thin Entrypoints.
      - Keep every new or modified TASK-014 TypeScript file at or below 500 lines.
      - Remove all five TASK-014 entries from the Source Size Baseline.
      - Preserve existing CLI flags, Runtime state transitions and GitHub or Jules API behavior.
      - Typecheck all TypeScript modules under ops instead of only direct ops/scripts files.
      - Pass schema, task graph, source-size, lint, typecheck, unit, build and full CI validation.
      - Synchronize TASK-014 registration into the committed Project State through Runtime Projection.
    allowed_paths:
      - ops/application/**
      - ops/domain/**
      - ops/infrastructure/github/**
      - ops/scripts/project-state-projection*.ts
      - ops/scripts/rebuild-project-state.ts
      - ops/scripts/reconcile-project*.ts
      - ops/scripts/source-size-validator.test.ts
      - ops/config/source-size-baseline.json
      - package.json
      - tsconfig.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-014.yaml
      - ops/state/project-state.json
    forbidden_paths:
      - src/**
      - content/**
      - public/**
      - docs/**
      - .github/workflows/**
      - ops/tasks/task-history.yaml
      - ops/tasks/task-templates.yaml
    forbidden_actions:
      - Do not change existing Runtime state-transition semantics.
      - Do not change GitHub, Jules or Netlify API contracts.
      - Do not change Workflow triggers, permissions or action pins.
      - Do not add or increase a Source Size exception.
      - Do not push directly to main.
      - Do not merge without exact-head validation evidence.
    validation_commands:
      - npm run validate:schemas
      - npm run validate:task-graph
      - npm run validate:source-size
      - npm run lint
      - npm run typecheck
      - npm run test:unit
      - npm run build
      - npm run ci
      - git diff --check
