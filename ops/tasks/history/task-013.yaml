tasks:
  - kind: task
    id: TASK-013
    title: Establish architecture baseline and source-size gate
    role: solution-architect
    type: architecture
    status: COMPLETED
    priority: P0
    enabled: false
    objective: Define the Juleswhile Control Plane architecture boundaries and enforce a non-regressive 500-line source-size ratchet without changing existing Runtime behavior.
    depends_on:
      - TASK-012
    inputs:
      - AGENTS.md
      - README.md
      - operator-guide.md
      - ops/scripts/**
      - ops/tasks/**
      - .github/workflows/**
      - package.json
    outputs:
      - docs/04_architecture/architecture-baseline.md
      - ops/config/source-size-baseline.json
      - ops/scripts/source-size-policy.ts
      - ops/scripts/source-size-validator.ts
      - ops/scripts/validate-source-size.ts
      - ops/scripts/source-size-test-fixture.ts
      - ops/scripts/source-size-validator.test.ts
      - ops/scripts/source-size-validator-edge.test.ts
      - package.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-013.yaml
      - ops/state/project-state.json
    acceptance_criteria:
      - Document Domain, Application, Ports, Infrastructure and Entrypoint responsibilities.
      - Document allowed and forbidden dependency directions.
      - Enforce a default physical source-size limit of 500 lines.
      - Reject a new managed file that exceeds 500 lines.
      - Reject growth of an existing exception beyond its committed baseline.
      - Require removal of an exception when its file reaches 500 lines or less.
      - Reject stale exceptions for missing files.
      - Reject arbitrary increases to an exception maximum.
      - Keep every new TASK-013 TypeScript file at or below 500 lines.
      - Connect source-size validation to the existing CI path.
      - Preserve all existing Runtime behavior.
      - Pass schema, task graph, source-size, typecheck, unit, build and full CI validation.
      - Synchronize the committed project-state summary atomically with TASK-013 registration.
    allowed_paths:
      - docs/04_architecture/architecture-baseline.md
      - ops/config/source-size-baseline.json
      - ops/scripts/source-size-policy.ts
      - ops/scripts/source-size-validator.ts
      - ops/scripts/validate-source-size.ts
      - ops/scripts/source-size-test-fixture.ts
      - ops/scripts/source-size-validator.test.ts
      - ops/scripts/source-size-validator-edge.test.ts
      - package.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-013.yaml
      - ops/state/project-state.json
    forbidden_paths:
      - src/**
      - content/**
      - public/**
      - .github/workflows/**
      - ops/tasks/task-history.yaml
      - ops/tasks/task-templates.yaml
    forbidden_actions:
      - Do not change existing Runtime behavior.
      - Do not change GitHub, Jules or Netlify API behavior.
      - Do not change Workflow triggers or permissions.
      - Do not increase an existing source-size exception maximum.
      - Do not push directly to main.
      - Do not merge without exact-head validation evidence.
    validation_commands:
      - npm run validate:schemas
      - npm run validate:task-graph
      - npm run validate:source-size
      - npm run typecheck
      - npm run test:unit
      - npm run build
      - npm run ci
      - git diff --check
    risk_level: high
    approval_policy: human
    parallelizable: false
    resource_locks:
      - control-plane-architecture
      - source-size-policy
    conflicts_with: []
    retry_policy:
      max_corrections: 2
      timeout_minutes: 120
    stitch:
      allowed: false
      required: false
      expected_outputs: []
