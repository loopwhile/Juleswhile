    forbidden_actions:
      - Do not add operational documentation under docs.
      - Do not change Workflow triggers, permissions or pinned action revisions.
      - Do not change TASK state-machine semantics.
      - Do not change Quota budgets or Jules Session creation rules.
      - Do not change Runtime Projection or Dashboard freshness semantics.
      - Do not change Netlify deployment success or failure semantics.
      - Do not alter existing TASK contract meaning while splitting Manifest files.
      - Do not expose, request or print Secret values.
      - Do not add or increase a Source Size exception.
      - Do not push directly to main.
      - Do not merge without exact-head validation evidence.
    validation_commands:
