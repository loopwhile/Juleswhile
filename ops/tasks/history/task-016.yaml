    acceptance_criteria:
      - Reduce 02-dispatch-jules.yml and 08-netlify-status.yml to at most 500 lines without changing triggers, permissions, action pins or Runtime semantics.
      - Split TASK-001 through TASK-012 into individually owned History Manifest files.
      - Remove ops/tasks/task-history.yaml after preserving every TASK contract, status, dependency and metadata field.
      - Keep README.md at the repository root and reduce it without moving its content into docs.
      - Replace operator-guide.md with numbered OPERATOR-GUIDE-01 through OPERATOR-GUIDE-09 files at the repository root.
      - Keep OPERATOR-GUIDE-01-OVERVIEW.md as the Operator Guide index.
      - Do not add new operational documentation under docs.
      - Preserve the essential repository and execution invariants in AGENTS.md.
      - Preserve the Project Goal contract in PROJECT_GOAL.md.
      - Preserve each Role and Prompt execution contract while removing duplication.
      - Extend the Source Size scope to validate OPERATOR-GUIDE-*.md.
      - Keep every managed source, Workflow, Manifest, operational document, Role and Prompt file at or below 500 lines.
      - Remove all fifteen TASK-016 entries from the Source Size Baseline.
      - Preserve TASK, Runtime Projection, Jules Dispatch and Netlify external behavior.
      - Pass schema, task graph, source-size, supply-chain, lint, typecheck, unit, build and full CI validation.
      - Synchronize TASK-016 registration into committed Project State through Runtime Projection.
