      - .github/workflows/10-runtime-projection-sync.yml
      - .github/workflows/06-reconciler.yml
      - .github/ISSUE_TEMPLATE/**
      - netlify.toml
    outputs:
      - ops/scripts/bootstrap-project.mjs
      - ops/scripts/**
      - ops/application/**
      - ops/domain/**
      - ops/ports/**
      - ops/infrastructure/**
      - ops/schemas/**
      - ops/config/**
      - ops/state/project-state.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-017.yaml
