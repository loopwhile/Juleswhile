      - OPERATOR-GUIDE-*.md
      - .gitignore
      - package.json
      - package-lock.json
      - netlify.toml
      - docs/**
    acceptance_criteria:
      - Separate Juleswhile maintenance History from the Runtime state created by a new project bootstrap.
      - Reset Project Goal, Runtime TASK state, Session evidence, Pull Requests, locks, quota usage, incidents and deployment references.
      - Replace or remove project-specific repository, Jules Source, Project ID, Smoke Test and Netlify values.
      - Provide Bootstrap preview or dry-run output before mutation.
      - Make Bootstrap safe on first execution, repeated execution and retry after interruption.
      - Refuse execution in an unexpected repository or unsafe working tree.
      - Never print Secret values or existing user credentials.
      - Keep project output files out of the Template Git tree under docs.
      - Create an empty untracked docs directory only as part of Bootstrap.
      - Prevent semantically identical Projection results from creating commits or Pull Requests.
      - Prevent Projection maintenance events and commits from recursively creating another maintenance Pull Request.
      - Preserve one Projection branch and one winning concurrent synchronization operation.
      - Prevent repeated Duplicate TASK Incidents for the same canonical and duplicate evidence set.
      - Verify canonical TASK Issues before resolving existing Duplicate Incidents.
      - Pass clean-room bootstrap validation in a newly initialized temporary repository.
      - Prove that TASK-001 through TASK-016 and existing Issue, PR, Session, Deploy, Quota and lock evidence do not leak into the new Runtime.
      - Confirm GitHub Template, default branch, permissions, ruleset, Jules and Netlify setup requirements.
      - Audit every command block in OPERATOR-GUIDE-01 through OPERATOR-GUIDE-09 against the current repository implementation.
      - Correct invalid command names, file paths, Environment Variable names and GitHub CLI syntax in the Operator Guides.
      - Correct the execution order for repository creation, Bootstrap, Jules Source discovery, Secret handling, Preflight and Automation activation.
      - Keep JULES_API_KEY available until Jules Source discovery is complete and unset it only after all required API operations.
      - Execute the documented Bootstrap command sequence during clean-room validation without undocumented repair steps.
      - Keep all managed files within the 500-line Source Size Contract with zero exceptions.
      - Pass schema, task graph, source-size, supply-chain, lint, typecheck, unit, build and full CI validation.
      - Close abnormal Incidents only after root-cause and recurrence verification.
      - Establish an exact verified Template release baseline.
    allowed_paths:
      - ops/scripts/**
      - ops/application/**
      - ops/domain/**
      - ops/ports/**
      - ops/infrastructure/**
      - ops/schemas/**
      - ops/config/**
      - ops/state/project-state.json
      - ops/tasks/task-index.yaml
      - ops/tasks/history/task-017.yaml
