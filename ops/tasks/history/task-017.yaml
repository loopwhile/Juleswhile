      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - README.md
      - QUICKSTART.md
      - AGENTS.md
      - PROJECT_GOAL.md
      - OPERATOR-GUIDE-*.md
      - .gitignore
      - package.json
      - package-lock.json
      - netlify.toml
      - docs/**
    forbidden_paths:
      - src/**
      - content/**
      - public/**
      - data/**
      - secrets/**
      - .env
      - .env.*
    forbidden_actions:
      - Do not push directly to main.
      - Do not weaken validation, branch protection or supply-chain checks.
      - Do not request, read, print or commit Secret values.
      - Do not close Duplicate Incidents before root-cause verification.
      - Do not delete Juleswhile maintenance History from the Template source repository.
      - Do not preserve maintenance History as executable Runtime TASK state after Bootstrap.
      - Do not create a release tag before verifying the exact merged head.
      - Do not change user-facing product source, content or public assets.
    validation_commands:
      - npm run validate:schemas
      - npm run validate:task-graph
      - npm run validate:source-size
      - npm run validate:supply-chain
      - npm run lint
      - npm run typecheck
      - npm run test:unit
      - npm run build
      - npm run ci
      - git diff --check
    risk_level: high
    approval_policy: human
    parallelizable: false
    resource_locks:
      - template-release
      - bootstrap-contract
      - runtime-projection
      - incident-idempotency
      - repository-contract
    conflicts_with: []
    retry_policy:
      max_corrections: 2
      timeout_minutes: 600
