    id: TASK-017
    title: Finalize Juleswhile as a clean reusable project template
    role: solution-architect
    type: maintenance
    status: RUNNING
    priority: P0
    enabled: true
    objective: Complete template release hardening, remove project-specific Runtime residue, eliminate recursive Projection and duplicate Incident behavior, and prove clean-room bootstrap operation in a new repository.
    depends_on:
      - TASK-016
    inputs:
      - PROJECT_GOAL.md
      - README.md
      - QUICKSTART.md
      - AGENTS.md
      - OPERATOR-GUIDE-*.md
