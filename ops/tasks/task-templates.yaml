  - kind: template
    id: TASK-902
    title: Economic and financial research brief
    role: researcher
    type: research
    status: TEMPLATE
    priority: P2
    enabled: false
    objective: Produce a sourced economic or financial research brief with source manifest,
      freshness notes, uncertainty, and explicit non-advice constraints.
    depends_on: []
    inputs:
      - PROJECT_GOAL.md
      - docs/03_research/**
      - "{{research_question}}"
      - "{{period_key}}"
    outputs:
      - docs/03_research/{{period_key}}-financial-brief.md
      - docs/03_research/{{period_key}}-source-manifest.yaml
    acceptance_criteria:
      - Each market, economic, or company claim has a cited source and access date.
      - Facts, estimates, forecasts, and interpretation are clearly separated.
      - The brief states that it is research only and not personalized investment advice.
      - Legal, tax, investment, or trading recommendations are not presented as instructions.
      - Current or volatile data is rechecked before submission.
    allowed_paths:
      - docs/03_research/**
    forbidden_paths:
      - .github/**
      - ops/**
      - src/auth/**
      - src/payment/**
      - package.json
      - package-lock.json
      - netlify.toml
    forbidden_actions:
      - Give personalized investment, legal, tax, or trading advice.
      - Promise returns or imply guaranteed outcomes.
      - Use stale market data without labeling the access date.
      - Expose or request secrets.
      - Directly push to main.
    validation_commands:
      - npm run validate:schemas
      - npm test
      - npm run build
    risk_level: high
    approval_policy: human
    parallelizable: false
    resource_locks:
      - research/{{period_key}}
    conflicts_with: []
    retry_policy:
      max_corrections: 2
      timeout_minutes: 120
    stitch:
      allowed: false
      required: false
      expected_outputs: []
    recurrence:
      enabled: false
      schedule: 41 2 * * *
      timezone: Asia/Seoul
      instance_id_strategy: date
      max_instances_per_day: 1
    metadata:
      goal_issue_number: null
      issue_number: null
