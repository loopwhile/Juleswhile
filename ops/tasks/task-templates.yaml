  - kind: template
    id: TASK-904
    title: Control-plane self-improvement proposal
    role: developer
    type: maintenance
    status: TEMPLATE
    priority: P1
    enabled: false
    objective: Propose and implement a bounded Juleswhile control-plane improvement only after
      human approval, with protected-file scope and rollback risk documented.
    depends_on: []
    inputs:
      - AGENTS.md
      - PROJECT_GOAL.md
      - "{{proposal_issue}}"
    outputs:
      - docs/07_operations/{{proposal_key}}.md
      - ops/tasks/**
      - ops/scripts/**
      - ops/schemas/**
      - .github/workflows/**
    acceptance_criteria:
      - The proposal references a GitHub TASK Issue and states the protected paths being changed.
      - Human approval is required before execution.
      - Automation, content automation, and secrets are not modified directly.
      - Validation commands and rollback risks are documented in the Pull Request.
    allowed_paths:
      - docs/07_operations/**
      - ops/tasks/**
      - ops/scripts/**
      - ops/schemas/**
      - .github/workflows/**
      - AGENTS.md
      - README.md
      - QUICKSTART.md
      - operator-guide.md
      - package.json
      - package-lock.json
      - netlify.toml
    forbidden_paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
      - src/auth/**
      - src/payment/**
      - content/**
    forbidden_actions:
      - Enable AUTOMATION_ENABLED or CONTENT_AUTOMATION_ENABLED.
      - Modify, print, request, or infer secret values.
      - Bypass Pull Request validation or direct-merge to main.
      - Make unbounded repository-wide rewrites.
    validation_commands:
      - npm run validate:schemas
      - npm run validate:task-graph
      - npm run validate:supply-chain
      - npm run typecheck
      - npm test
      - npm run build
      - npm run ci
      - git diff --check
    risk_level: high
    approval_policy: human-before-execution
    parallelizable: false
    resource_locks:
      - control-plane
    conflicts_with: []
    retry_policy:
      max_corrections: 2
      timeout_minutes: 120
    stitch:
      allowed: false
      required: false
      expected_outputs: []
    recurrence:
      enabled: false
      schedule: 0 4 * * *
      timezone: Asia/Seoul
      instance_id_strategy: external
      max_instances_per_day: 1
