        - economics
        - research
      template_id: null
      instance_key: null
  - kind: template
    id: TASK-903
    title: Internal project creation and dashboard tracking
    role: project-planner
    type: planning
    status: TEMPLATE
    priority: P1
    enabled: false
    objective: Create an internal project plan, TASK manifest proposal, and dashboard tracking
      updates for a human-approved project objective.
    depends_on: []
    inputs:
      - PROJECT_GOAL.md
      - "{{goal_issue}}"
      - "{{project_key}}"
    outputs:
      - docs/01_overview/{{project_key}}.md
      - ops/tasks/{{project_key}}-tasks.yaml
      - ops/state/project-state.json
    acceptance_criteria:
      - The project objective, scope, non-goals, risks, and acceptance criteria are documented.
      - TASKs are small, dependency-aware, and individually verifiable.
      - Dashboard state remains free of secret values and personal credentials.
      - Automation is not enabled by this template instance.
    allowed_paths:
      - docs/01_overview/**
      - ops/tasks/**
      - ops/state/project-state.json
    forbidden_paths:
      - .github/**
      - ops/schemas/**
      - ops/scripts/**
      - package.json
      - package-lock.json
      - netlify.toml
    forbidden_actions:
      - Enable automation or content automation.
      - Modify secrets or credentials.
      - Start implementation TASKs without explicit GitHub TASK Issues.
      - Directly push to main.
    validation_commands:
      - npm run validate:schemas
      - npm run validate:task-graph
      - npm test
    risk_level: high
    approval_policy: human
    parallelizable: false
    resource_locks:
      - project-planning/{{project_key}}
    conflicts_with: []
    retry_policy:
      max_corrections: 2
      timeout_minutes: 90
    stitch:
      allowed: false
      required: false
      expected_outputs: []
    recurrence:
      enabled: false
      schedule: 0 3 * * *
      timezone: Asia/Seoul
      instance_id_strategy: external
      max_instances_per_day: 1
