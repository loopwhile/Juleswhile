name: "06 · Reconciler"

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "상태를 변경하지 않고 복구 계획만 확인"
        required: false
        default: true
        type: boolean

      force:
        description: "AUTOMATION_ENABLED 상태를 무시"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: project-orchestration-${{ github.repository }}
  cancel-in-progress: false

env:
  AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
  STALE_DISPATCHING_MINUTES: ${{ vars.STALE_DISPATCHING_MINUTES || '20' }}
  STALE_RUNNING_MINUTES: ${{ vars.STALE_RUNNING_MINUTES || '180' }}
  STALE_VALIDATING_MINUTES: ${{ vars.STALE_VALIDATING_MINUTES || '60' }}
  SESSION_TIMEOUT_MINUTES: ${{ vars.SESSION_TIMEOUT_MINUTES || '240' }}
  MAX_CORRECTIONS: ${{ vars.DEFAULT_MAX_CORRECTIONS || '2' }}

jobs:
  reconcile:
    name: Reconcile project state
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve Reconciler mode
        id: input
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            DRY_RUN="${MANUAL_DRY_RUN:-true}"
            FORCE_RUN="${MANUAL_FORCE:-false}"
          else
            DRY_RUN=false
            FORCE_RUN=false
          fi

          if [[ "$AUTOMATION_ENABLED" != "true" ]] \
            && [[ "$DRY_RUN" != "true" ]] \
            && [[ "$FORCE_RUN" != "true" ]]; then
            echo "::notice::자동화가 비활성화되어 Scheduled Reconciler를 건너뜁니다."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "force=${FORCE_RUN}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: steps.input.outputs.should_run == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        if: steps.input.outputs.should_run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Reconciler files
        if: steps.input.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          REQUIRED_FILES=(
            "package.json"
            "ops/tasks/task-index.yaml"
            "ops/state/project-state.json"
            "ops/scripts/reconcile-project.ts"
            "ops/scripts/rebuild-project-state.ts"
            "ops/schemas/project-state.schema.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::필수 Reconciler 파일이 없습니다: ${file}"
              exit 1
            fi
          done

      - name: Install dependencies
        if: steps.input.outputs.should_run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Check Jules API key availability
        if: steps.input.outputs.should_run == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${JULES_API_KEY}" ]]; then
            echo "::warning::JULES_API_KEY secret is not available to this workflow run."
          else
            echo "::notice::JULES_API_KEY secret is available."
          fi

      - name: Reconcile Juleswhile state
        id: reconcile
        if: steps.input.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ steps.input.outputs.dry_run }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_BASE_URL: ${{ vars.JULES_API_BASE_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RESULT_FILE="${RUNNER_TEMP}/reconcile-result.json"

          COMMAND=(
            npm
            run
            reconcile:project
            --
            --response-file
            "$RESULT_FILE"
            --stale-dispatching-minutes
            "$STALE_DISPATCHING_MINUTES"
            --stale-running-minutes
            "$STALE_RUNNING_MINUTES"
            --stale-validating-minutes
            "$STALE_VALIDATING_MINUTES"
            --session-timeout-minutes
            "$SESSION_TIMEOUT_MINUTES"
            --max-corrections
            "$MAX_CORRECTIONS"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            COMMAND+=(--dry-run)
          else
            COMMAND+=(--apply)
          fi

          "${COMMAND[@]}"

          jq empty "$RESULT_FILE"

          SHOULD_SCHEDULE_NEXT="$(
            jq -r '.shouldScheduleNext // false' \
              "$RESULT_FILE"
          )"

          SCANNED="$(
            jq -r '.summary.scanned // 0' \
              "$RESULT_FILE"
          )"

          REPAIRED="$(
            jq -r '.summary.repaired // 0' \
              "$RESULT_FILE"
          )"

          STUCK="$(
            jq -r '.summary.stuck // 0' \
              "$RESULT_FILE"
          )"

          BLOCKED="$(
            jq -r '.summary.blocked // 0' \
              "$RESULT_FILE"
          )"

          RETRIED="$(
            jq -r '.summary.retried // 0' \
              "$RESULT_FILE"
          )"

          INCIDENTS="$(
            jq -r '.summary.incidents // 0' \
              "$RESULT_FILE"
          )"

          SESSIONS_CHECKED="$(
            jq -r '.summary.sessions_checked // 0' \
              "$RESULT_FILE"
          )"

          SESSIONS_RECOVERED="$(
            jq -r '.summary.sessions_recovered // 0' \
              "$RESULT_FILE"
          )"

          API_ERRORS="$(
            jq -r '.summary.api_errors // 0' \
              "$RESULT_FILE"
          )"

          UNKNOWN_STATES="$(
            jq -r '.summary.unknown_states // 0' \
              "$RESULT_FILE"
          )"

          echo "should_schedule_next=${SHOULD_SCHEDULE_NEXT}" \
            >> "$GITHUB_OUTPUT"
          echo "scanned=${SCANNED}" >> "$GITHUB_OUTPUT"
          echo "repaired=${REPAIRED}" >> "$GITHUB_OUTPUT"
          echo "stuck=${STUCK}" >> "$GITHUB_OUTPUT"
          echo "blocked=${BLOCKED}" >> "$GITHUB_OUTPUT"
          echo "retried=${RETRIED}" >> "$GITHUB_OUTPUT"
          echo "incidents=${INCIDENTS}" >> "$GITHUB_OUTPUT"
          echo "sessions_checked=${SESSIONS_CHECKED}" >> "$GITHUB_OUTPUT"
          echo "sessions_recovered=${SESSIONS_RECOVERED}" >> "$GITHUB_OUTPUT"
          echo "api_errors=${API_ERRORS}" >> "$GITHUB_OUTPUT"
          echo "unknown_states=${UNKNOWN_STATES}" >> "$GITHUB_OUTPUT"
          echo "result_file=${RESULT_FILE}" >> "$GITHUB_OUTPUT"

      - name: Rebuild runtime state projection
        id: projection
        if: steps.input.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ steps.input.outputs.dry_run }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_API_BASE_URL: ${{ vars.JULES_API_BASE_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail

          RESULT_FILE="${RUNNER_TEMP}/project-state-projection.json"

          COMMAND=(
            npm
            run
            project:state
            --
            --response-file
            "$RESULT_FILE"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            COMMAND+=(--dry-run)
          else
            COMMAND+=(--apply)
          fi

          "${COMMAND[@]}"

          jq empty "$RESULT_FILE"

          CHANGED="$(
            jq -r '.changed // false'               "$RESULT_FILE"
          )"

          OBSERVED_AT="$(
            jq -r '.observedAt // ""'               "$RESULT_FILE"
          )"

          TASK_TOTAL="$(
            jq -r '.taskSummary.total // 0'               "$RESULT_FILE"
          )"

          TASK_COMPLETED="$(
            jq -r '.taskSummary.completed // 0'               "$RESULT_FILE"
          )"

          TASK_READY="$(
            jq -r '.taskSummary.ready // 0'               "$RESULT_FILE"
          )"

          STATE_LABEL_CONFLICTS="$(
            jq -r '.drift.stateLabelConflicts | length'               "$RESULT_FILE"
          )"

          MISSING_CANONICAL_ISSUES="$(
            jq -r '.drift.missingCanonicalIssues | length'               "$RESULT_FILE"
          )"

          SUPERSEDED_ISSUES="$(
            jq -r '.drift.supersededIssues | length'               "$RESULT_FILE"
          )"

          MANIFEST_MISMATCHES="$(
            jq -r '.drift.manifestMismatches | length'               "$RESULT_FILE"
          )"

          ISSUE_LIFECYCLE_MISMATCHES="$(
            jq -r '.drift.issueLifecycleMismatches | length'               "$RESULT_FILE"
          )"

          SESSION_LOOKUP_ERRORS="$(
            jq -r '.sessionLookupErrors | length'               "$RESULT_FILE"
          )"

          echo "result_file=${RESULT_FILE}"             >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED}"             >> "$GITHUB_OUTPUT"
          echo "observed_at=${OBSERVED_AT}"             >> "$GITHUB_OUTPUT"
          echo "task_total=${TASK_TOTAL}"             >> "$GITHUB_OUTPUT"
          echo "task_completed=${TASK_COMPLETED}"             >> "$GITHUB_OUTPUT"
          echo "task_ready=${TASK_READY}"             >> "$GITHUB_OUTPUT"
          echo "state_label_conflicts=${STATE_LABEL_CONFLICTS}"             >> "$GITHUB_OUTPUT"
          echo "missing_canonical_issues=${MISSING_CANONICAL_ISSUES}"             >> "$GITHUB_OUTPUT"
          echo "superseded_issues=${SUPERSEDED_ISSUES}"             >> "$GITHUB_OUTPUT"
          echo "manifest_mismatches=${MANIFEST_MISMATCHES}"             >> "$GITHUB_OUTPUT"
          echo "issue_lifecycle_mismatches=${ISSUE_LIFECYCLE_MISMATCHES}"             >> "$GITHUB_OUTPUT"
          echo "session_lookup_errors=${SESSION_LOOKUP_ERRORS}"             >> "$GITHUB_OUTPUT"

          if [[ "$SESSION_LOOKUP_ERRORS" -gt 0 ]]; then
            echo "::error::Jules Session 조회 오류가 있어 Projection 결과를 신뢰할 수 없습니다."
            exit 1
          fi

          if [[ "$MISSING_CANONICAL_ISSUES" -gt 0 ]]; then
            echo "::error::canonical TASK Issue가 누락되었습니다."
            exit 1
          fi

          if [[ "$MANIFEST_MISMATCHES" -gt 0 ]]; then
            echo "::error::Manifest와 canonical Issue 사이에 상태 불일치가 있습니다."
            exit 1
          fi

      - name: Trigger next TASK evaluation
        if: >-
          steps.reconcile.outputs.should_schedule_next == 'true' &&
          steps.input.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail

          PAYLOAD_FILE="${RUNNER_TEMP}/reconcile-ready-dispatch.json"

          jq -n \
            '{
              event_type: "reconcile_ready",
              client_payload: {
                task_id: "",
                dry_run: false,
                reason: "reconciler"
              }
            }' \
            > "$PAYLOAD_FILE"

          gh api \
            --method POST \
            "repos/${REPOSITORY}/dispatches" \
            --input "$PAYLOAD_FILE"

      - name: Write Reconciler summary
        if: steps.input.outputs.should_run == 'true'
        env:
          DRY_RUN: ${{ steps.input.outputs.dry_run }}
          SCANNED: ${{ steps.reconcile.outputs.scanned }}
          REPAIRED: ${{ steps.reconcile.outputs.repaired }}
          STUCK: ${{ steps.reconcile.outputs.stuck }}
          BLOCKED: ${{ steps.reconcile.outputs.blocked }}
          RETRIED: ${{ steps.reconcile.outputs.retried }}
          INCIDENTS: ${{ steps.reconcile.outputs.incidents }}
          SESSIONS_CHECKED: ${{ steps.reconcile.outputs.sessions_checked }}
          SESSIONS_RECOVERED: ${{ steps.reconcile.outputs.sessions_recovered }}
          API_ERRORS: ${{ steps.reconcile.outputs.api_errors }}
          UNKNOWN_STATES: ${{ steps.reconcile.outputs.unknown_states }}
          SHOULD_SCHEDULE_NEXT: ${{ steps.reconcile.outputs.should_schedule_next }}
          PROJECTION_CHANGED: ${{ steps.projection.outputs.changed }}
          PROJECTION_OBSERVED_AT: ${{ steps.projection.outputs.observed_at }}
          PROJECTION_TASK_TOTAL: ${{ steps.projection.outputs.task_total }}
          PROJECTION_TASK_COMPLETED: ${{ steps.projection.outputs.task_completed }}
          PROJECTION_TASK_READY: ${{ steps.projection.outputs.task_ready }}
          PROJECTION_STATE_CONFLICTS: ${{ steps.projection.outputs.state_label_conflicts }}
          PROJECTION_MISSING_ISSUES: ${{ steps.projection.outputs.missing_canonical_issues }}
          PROJECTION_SUPERSEDED_ISSUES: ${{ steps.projection.outputs.superseded_issues }}
          PROJECTION_MANIFEST_MISMATCHES: ${{ steps.projection.outputs.manifest_mismatches }}
          PROJECTION_LIFECYCLE_MISMATCHES: ${{ steps.projection.outputs.issue_lifecycle_mismatches }}
          PROJECTION_SESSION_ERRORS: ${{ steps.projection.outputs.session_lookup_errors }}
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "# Juleswhile Reconciler"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Dry Run | \`${DRY_RUN}\` |"
            echo "| Scanned | \`${SCANNED}\` |"
            echo "| Repaired | \`${REPAIRED}\` |"
            echo "| Stuck | \`${STUCK}\` |"
            echo "| Retried | \`${RETRIED}\` |"
            echo "| Blocked | \`${BLOCKED}\` |"
            echo "| Incidents | \`${INCIDENTS}\` |"
            echo "| Sessions checked | \`${SESSIONS_CHECKED}\` |"
            echo "| Sessions recovered | \`${SESSIONS_RECOVERED}\` |"
            echo "| API errors | \`${API_ERRORS}\` |"
            echo "| Unknown states | \`${UNKNOWN_STATES}\` |"
            echo "| Schedule next TASK | \`${SHOULD_SCHEDULE_NEXT}\` |"
            echo
            echo "## Runtime State Projection"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| Changed | \`${PROJECTION_CHANGED}\` |"
            echo "| Observed at | \`${PROJECTION_OBSERVED_AT}\` |"
            echo "| TASK total | \`${PROJECTION_TASK_TOTAL}\` |"
            echo "| TASK completed | \`${PROJECTION_TASK_COMPLETED}\` |"
            echo "| TASK ready | \`${PROJECTION_TASK_READY}\` |"
            echo "| State-label conflicts | \`${PROJECTION_STATE_CONFLICTS}\` |"
            echo "| Missing canonical Issues | \`${PROJECTION_MISSING_ISSUES}\` |"
            echo "| Superseded Issues | \`${PROJECTION_SUPERSEDED_ISSUES}\` |"
            echo "| Manifest mismatches | \`${PROJECTION_MANIFEST_MISMATCHES}\` |"
            echo "| Lifecycle mismatches | \`${PROJECTION_LIFECYCLE_MISMATCHES}\` |"
            echo "| Session lookup errors | \`${PROJECTION_SESSION_ERRORS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Reconciler report
        if: always() && steps.reconcile.outputs.result_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            reconciler-report-${{
              github.run_id
            }}-${{
              github.run_attempt
            }}
          path: ${{ steps.reconcile.outputs.result_file }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Runtime State Projection report
        if: always() && steps.projection.outputs.result_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            runtime-state-projection-${{
              github.run_id
            }}-${{
              github.run_attempt
            }}
          path: ${{ steps.projection.outputs.result_file }}
          if-no-files-found: warn
          retention-days: 14
