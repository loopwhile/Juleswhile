name: "03 · CI Correction"

on:
  repository_dispatch:
    types: [pr_validation_failed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to correct"
        required: true
        type: number
      force:
        description: "Ignore AUTOMATION_ENABLED"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ci-correction-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: false

env:
  AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
  DEFAULT_MAX_CORRECTIONS: ${{ vars.DEFAULT_MAX_CORRECTIONS || '2' }}
  JULES_SOURCE_NAME: ${{ vars.JULES_SOURCE_NAME }}

jobs:
  correct:
    name: Request bounded Jules correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Resolve correction context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          EVENT_TASK_ID: ${{ github.event.client_payload.task_id }}
          EVENT_TASK_ISSUE: ${{ github.event.client_payload.task_issue_number }}
          EVENT_RUN_URL: ${{ github.event.client_payload.run_url }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number }}
          MANUAL_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            PR_NUMBER="${MANUAL_PR_NUMBER}"
            FORCE_RUN="${MANUAL_FORCE:-false}"
          else
            PR_NUMBER="${EVENT_PR_NUMBER}"
            FORCE_RUN=false
          fi
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          if [[ "$AUTOMATION_ENABLED" != "true" && "$FORCE_RUN" != "true" ]]; then
            echo "::notice::AUTOMATION_ENABLED is not true; correction skipped"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          STATE="$(jq -r '.state' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft // false' <<<"$PR_JSON")"
          HEAD_REF="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"
          TITLE="$(jq -r '.title' <<<"$PR_JSON")"
          [[ "$STATE" == "open" && "$DRAFT" == "false" ]] || { echo "::notice::PR is not correctable"; echo "should_run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$HEAD_REPO" == "$REPOSITORY" ]] || { echo "::error::Cross-repository correction is forbidden"; exit 1; }

          TASK_ID="${EVENT_TASK_ID:-}"
          if [[ -z "$TASK_ID" && "$TITLE" =~ ^\[(TASK-[0-9]{3,}|GOAL-[0-9]+|CORRECTION-[A-Z0-9-]+)\] ]]; then TASK_ID="${BASH_REMATCH[1]}"; fi
          [[ "$TASK_ID" =~ ^(TASK-[0-9]{3,}|GOAL-[0-9]+|CORRECTION-[A-Z0-9-]+)$ ]] || { echo "::error::Managed id not found"; exit 1; }

          ATTEMPTS="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --paginate --jq '[.[] | select((.body // "") | contains("<!-- juleswhile:correction-dispatch -->"))] | length' | awk '{s+=$1} END{print s+0}')"
          if (( ATTEMPTS >= DEFAULT_MAX_CORRECTIONS )); then
            gh label create state:blocked --repo "$REPOSITORY" --color D73A4A --description "TASK requires intervention" --force
            gh label create human-decision-required --repo "$REPOSITORY" --color D93F0B --description "Human decision required" --force
            jq -n '{labels:["state:blocked","human-decision-required"]}' | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --input - >/dev/null
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "<!-- juleswhile:correction-limit -->

## 자동 보완 한도 초과

자동 Correction ${ATTEMPTS}/${DEFAULT_MAX_CORRECTIONS}회를 사용하여 사람 검토로 전환했습니다." || true
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ATTEMPT=$((ATTEMPTS + 1))
          RUN_URL="${EVENT_RUN_URL:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}"
          {
            echo "should_run=true"
            echo "pr_number=${PR_NUMBER}"
            echo "task_id=${TASK_ID}"
            echo "task_issue=${EVENT_TASK_ISSUE:-}"
            echo "head_ref=${HEAD_REF}"
            echo "head_sha=${HEAD_SHA}"
            echo "attempt=${ATTEMPT}"
            echo "run_url=${RUN_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Create and record Jules correction session
        if: steps.context.outputs.should_run == 'true'
        id: session
        env:
          GH_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          TASK_ID: ${{ steps.context.outputs.task_id }}
          TASK_ISSUE: ${{ steps.context.outputs.task_issue }}
          HEAD_REF: ${{ steps.context.outputs.head_ref }}
          HEAD_SHA: ${{ steps.context.outputs.head_sha }}
          ATTEMPT: ${{ steps.context.outputs.attempt }}
          FAILED_RUN_URL: ${{ steps.context.outputs.run_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$JULES_API_KEY" ]] || { echo "::error::JULES_API_KEY missing"; exit 1; }
          [[ "$JULES_SOURCE_NAME" =~ ^sources/ ]] || { echo "::error::JULES_SOURCE_NAME invalid"; exit 1; }

          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "<!-- juleswhile:correction-dispatch -->

## Jules Correction Dispatch

- TASK: \`${TASK_ID}\`
- Attempt: \`${ATTEMPT}/${DEFAULT_MAX_CORRECTIONS}\`
- Failed validation: ${FAILED_RUN_URL}

동일 PR 브랜치에서 실패 원인만 최소 수정하도록 Jules에 요청합니다."

          PROMPT="$(cat <<EOF
Correct the existing Juleswhile PR #${PR_NUMBER} for ${TASK_ID} after validation failure.
Repository: ${GITHUB_REPOSITORY}
TASK Issue: ${TASK_ISSUE:-not-linked}
Existing branch: ${HEAD_REF}
Failed commit: ${HEAD_SHA}
Failed workflow: ${FAILED_RUN_URL}
Attempt: ${ATTEMPT}/${DEFAULT_MAX_CORRECTIONS}

Read AGENTS.md, PROJECT_GOAL.md, ops/prompts/correct-task.md, the TASK contract, PR diff, and failed logs. Work only on ${HEAD_REF}. Do not create a new branch or PR. Do not change scope or acceptance criteria. Never delete, skip, or weaken tests. Fix only the root cause, run all validation commands and npm run ci when available, then push correction commits to ${HEAD_REF}. If unsafe, report BLOCKED without unrelated changes.
EOF
)"

          jq -n --arg prompt "$PROMPT" --arg title "[${TASK_ID}] Correct PR #${PR_NUMBER}" --arg source "$JULES_SOURCE_NAME" --arg branch "$HEAD_REF" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false}' \
            > "${RUNNER_TEMP}/request.json"

          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 60 \
            -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "Content-Type: application/json" -H "x-goog-api-key: ${JULES_API_KEY}" \
            --data-binary "@${RUNNER_TEMP}/request.json" > "${RUNNER_TEMP}/response.json"

          SESSION_NAME="$(jq -r '.name // empty' "${RUNNER_TEMP}/response.json")"
          SESSION_ID="$(jq -r '.id // (.name // "" | split("/") | last) // empty' "${RUNNER_TEMP}/response.json")"
          [[ -n "$SESSION_NAME" || -n "$SESSION_ID" ]] || { echo "::error::No Jules session identity"; jq '{error,message,state}' "${RUNNER_TEMP}/response.json"; exit 1; }

          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "<!-- juleswhile:correction-session -->

## Jules Correction Session 생성 완료

- Session: \`${SESSION_NAME:-unknown}\`
- Session ID: \`${SESSION_ID:-unknown}\`
- Existing branch: \`${HEAD_REF}\`

새 커밋이 Push되면 PR Validation이 자동 재실행됩니다."
