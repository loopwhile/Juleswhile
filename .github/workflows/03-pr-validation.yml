name: "03 · PR Validation"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions: {}

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  validate:
    name: Normalize and validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      task_id: ${{ steps.meta.outputs.task_id }}
      task_issue: ${{ steps.meta.outputs.task_issue }}
      goal_issue: ${{ steps.meta.outputs.goal_issue }}
      control_plane: ${{ steps.scope.outputs.control_plane }}
    steps:
      - name: Invalidate stale validation labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for label in validation:passed validation:failed; do
            ENCODED_LABEL="$(jq -rn --arg value "$label" '$value|@uri')"
            gh api --method DELETE "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/${ENCODED_LABEL}" >/dev/null 2>&1 || true
          done

      - name: Normalize PR contract
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ALLOW_FORK_PRS: ${{ vars.ALLOW_FORK_PRS || 'false' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          PR_JSON="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          TITLE="$(jq -r '.title // ""' <<<"$PR_JSON")"
          BODY="$(jq -r '.body // ""' <<<"$PR_JSON")"
          BASE="$(jq -r '.base.ref // ""' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // ""' <<<"$PR_JSON")"
          BASE_REPO="$(jq -r '.base.repo.full_name // ""' <<<"$PR_JSON")"
          DRAFT="$(jq -r '.draft // false' <<<"$PR_JSON")"

          [[ "$BASE" == "main" ]] || {
            echo "::error::PR base branch must be main"
            exit 1
          }

          if [[ "$HEAD_REPO" != "$BASE_REPO" && "$ALLOW_FORK_PRS" != "true" ]]; then
            echo "::error::Fork Pull Requests are disabled"
            exit 1
          fi

          if [[ ! "$TITLE" =~ ^\[(TASK-[0-9]{3,}|GOAL-[0-9]+|CORRECTION-[A-Z0-9-]+|MAINTENANCE|TEMPLATE)\] ]]; then
            echo "::error::Invalid managed PR title"
            exit 1
          fi

          TASK_ID="${BASH_REMATCH[1]}"
          TASK_ISSUE="$(
            grep -Eio 'TASK Issue:[[:space:]]*(https://github.com/[^/[:space:]]+/[^/[:space:]]+/issues/)?#?[0-9]+' <<<"$BODY" \
              | grep -Eo '[0-9]+$' \
              | head -1 \
              || true
          )"
          GOAL_ISSUE="$(
            grep -Eio 'Goal Issue:[[:space:]]*(https://github.com/[^/[:space:]]+/[^/[:space:]]+/issues/)?#?[0-9]+' <<<"$BODY" \
              | grep -Eo '[0-9]+$' \
              | head -1 \
              || true
          )"

          if [[ "$TASK_ID" =~ ^TASK- && -z "$TASK_ISSUE" ]]; then
            TASK_ISSUE="$(
              gh api "repos/${REPOSITORY}/issues?state=all&per_page=100" --paginate \
                --jq ".[] | select(.pull_request == null) | select((.title | test(\"${TASK_ID}\"; \"i\")) or ((.body // \"\") | contains(\"juleswhile:task-id:${TASK_ID}\"))) | .number" \
                | head -1
            )"
          fi

          if [[ "$TASK_ID" =~ ^TASK- && ! "$TASK_ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::Canonical TASK Issue not found for ${TASK_ID}"
            exit 1
          fi

          if [[ "$TASK_ID" =~ ^GOAL- && -z "$GOAL_ISSUE" ]]; then
            GOAL_ISSUE="${TASK_ID#GOAL-}"
          fi

          if [[ "$TASK_ID" =~ ^GOAL- ]]; then
            [[ "$GOAL_ISSUE" =~ ^[0-9]+$ ]] || {
              echo "::error::Goal Issue reference is invalid"
              exit 1
            }
            gh api "repos/${REPOSITORY}/issues/${GOAL_ISSUE}" >/dev/null
          fi

          NEXT_BODY="$BODY"
          if [[ "$TASK_ID" =~ ^(TASK-|GOAL-) && "$NEXT_BODY" != *"<!-- juleswhile:task-pr -->"* ]]; then
            NEXT_BODY="$(printf '<!-- juleswhile:task-pr -->\n\n%s' "$NEXT_BODY")"
          fi
          if [[ "$TASK_ID" =~ ^TASK- ]] && ! grep -Eqi 'TASK Issue:' <<<"$NEXT_BODY"; then
            NEXT_BODY="$(printf '%s\n\nTASK Issue: #%s' "$NEXT_BODY" "$TASK_ISSUE")"
          fi
          if [[ "$TASK_ID" =~ ^GOAL- ]] && ! grep -Eqi 'Goal Issue:' <<<"$NEXT_BODY"; then
            NEXT_BODY="$(printf '%s\n\nGoal Issue: #%s' "$NEXT_BODY" "$GOAL_ISSUE")"
          fi

          if [[ "$NEXT_BODY" != "$BODY" ]]; then
            jq -n --arg body "$NEXT_BODY" '{body:$body}' \
              | gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --input - >/dev/null
          fi

          if [[ "$DRAFT" == "true" ]]; then
            gh pr ready "$PR_NUMBER" --repo "$REPOSITORY"
          fi

          {
            echo "task_id=${TASK_ID}"
            echo "task_issue=${TASK_ISSUE}"
            echo "goal_issue=${GOAL_ISSUE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed files and control-plane scope
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          CHANGED_FILES="${RUNNER_TEMP}/changed-files.txt"
          git diff --name-only --diff-filter=ACDMRTUXB "$BASE_SHA" "$HEAD_SHA" \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > "$CHANGED_FILES"

          [[ -s "$CHANGED_FILES" ]] || {
            echo "::error::Pull Request has no changed files"
            exit 1
          }

          CONTROL_PLANE=false
          while IFS= read -r file; do
            case "$file" in
              AGENTS.md|.github/*|ops/schemas/*|ops/scripts/*|package.json|package-lock.json|netlify.toml)
                CONTROL_PLANE=true
                ;;
            esac
          done < "$CHANGED_FILES"

          echo "control_plane=${CONTROL_PLANE}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Run required validation
        env:
          TASK_ID: ${{ steps.meta.outputs.task_id }}
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run validate:schemas
          npm run validate:task-graph
          npm run validate:pr-scope -- \
            --task-id "$TASK_ID" \
            --change-list "${RUNNER_TEMP}/changed-files.txt" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

          for script in validate:supply-chain lint typecheck test build; do
            if jq -e --arg script "$script" '.scripts[$script] | type == "string"' package.json >/dev/null; then
              npm run "$script"
            else
              echo "::notice::Optional package script is not defined: ${script}"
            fi
          done

          git diff --check "$BASE_SHA" "$HEAD_SHA"
          npx tsx ops/scripts/verify-repository-integrity.ts \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

  publish:
    name: Publish validation result
    if: always()
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Label PR and dispatch controller event
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.validate.result }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          TASK_ISSUE: ${{ needs.validate.outputs.task_issue }}
          GOAL_ISSUE: ${{ needs.validate.outputs.goal_issue }}
          CONTROL_PLANE: ${{ needs.validate.outputs.control_plane }}
        shell: bash
        run: |
          set -Eeuo pipefail

          for spec in \
            'juleswhile:managed|0052CC|Managed by Juleswhile' \
            'validation:passed|0E8A16|Required validation passed' \
            'validation:failed|D73A4A|Required validation failed' \
            'risk:control-plane|B60205|Control-plane change' \
            'human-approval-required|D93F0B|Human approval required' \
            'approval:owner-approved|0E8A16|Owner explicitly approved the PR'; do
            IFS='|' read -r name color description <<<"$spec"
            gh label create "$name" --repo "$REPOSITORY" --color "$color" --description "$description" --force
          done

          for label in validation:passed validation:failed; do
            ENCODED_LABEL="$(jq -rn --arg value "$label" '$value|@uri')"
            gh api --method DELETE "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/${ENCODED_LABEL}" >/dev/null 2>&1 || true
          done

          if [[ "$RESULT" == "success" ]]; then
            RESULT_LABEL="validation:passed"
            EVENT_TYPE="pr_validation_passed"
            EVIDENCE_RESULT="passed"
          else
            RESULT_LABEL="validation:failed"
            EVENT_TYPE="pr_validation_failed"
            EVIDENCE_RESULT="failed"
          fi

          jq -n \
            --arg managed "juleswhile:managed" \
            --arg result "$RESULT_LABEL" \
            '{labels:[$managed,$result]}' \
            | gh api \
                --method POST \
                "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
                --input - \
                >/dev/null

          EVIDENCE_FILE="${RUNNER_TEMP}/validation-evidence.md"

          {
            echo '<!-- juleswhile:validation-evidence -->'
            echo '```text'
            echo "head_sha: ${HEAD_SHA}"
            echo "result: ${EVIDENCE_RESULT}"
            echo "run_url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo '```'
          } > "$EVIDENCE_FILE"

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file "$EVIDENCE_FILE"

          if [[ "$CONTROL_PLANE" == "true" ]]; then
            jq -n '{labels:["risk:control-plane","human-approval-required"]}' \
              | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --input - >/dev/null
          fi

          if [[ -n "$TASK_ID" ]]; then
            jq -n \
              --arg event_type "$EVENT_TYPE" \
              --arg task_id "$TASK_ID" \
              --arg task_issue_number "$TASK_ISSUE" \
              --arg goal_issue_number "$GOAL_ISSUE" \
              --arg head_sha "$HEAD_SHA" \
              --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --argjson pr_number "$PR_NUMBER" \
              '{event_type:$event_type,client_payload:{pr_number:$pr_number,task_id:$task_id,task_issue_number:$task_issue_number,goal_issue_number:$goal_issue_number,head_sha:$head_sha,run_url:$run_url}}' \
              | gh api --method POST "repos/${REPOSITORY}/dispatches" --input -
          fi

          if [[ "$RESULT" != "success" ]]; then
            cat > "${RUNNER_TEMP}/pr-validation-failed.md" <<EOF
          <!-- juleswhile:pr-validation-failed -->

          ## Juleswhile PR Validation 실패

          - Commit: \`${HEAD_SHA}\`
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          실패한 검증을 삭제하거나 약화하지 마십시오. Jules가 생성한 PR이면 CI Correction Controller가 기존 Jules Session과 Native CI Fixer를 통해 보완을 시도합니다.
          EOF
            gh pr comment "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --body-file "${RUNNER_TEMP}/pr-validation-failed.md" \
              || true
          fi
