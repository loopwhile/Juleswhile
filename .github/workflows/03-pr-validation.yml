name: "03 · PR Validation"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  validate:
    name: Normalize and validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
    outputs:
      task_id: ${{ steps.meta.outputs.task_id }}
      task_issue: ${{ steps.meta.outputs.task_issue }}
      goal_issue: ${{ steps.meta.outputs.goal_issue }}
      control_plane: ${{ steps.scope.outputs.control_plane }}
    steps:
      - name: Normalize PR contract
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ALLOW_FORK_PRS: ${{ vars.ALLOW_FORK_PRS || 'false' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          PR="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          TITLE="$(jq -r '.title // ""' <<<"$PR")"
          BODY="$(jq -r '.body // ""' <<<"$PR")"
          BASE="$(jq -r '.base.ref // ""' <<<"$PR")"
          HEAD_REPO="$(jq -r '.head.repo.full_name // ""' <<<"$PR")"
          BASE_REPO="$(jq -r '.base.repo.full_name // ""' <<<"$PR")"
          DRAFT="$(jq -r '.draft // false' <<<"$PR")"
          [[ "$BASE" == main ]] || { echo "::error::Base branch must be main"; exit 1; }
          [[ "$HEAD_REPO" == "$BASE_REPO" || "$ALLOW_FORK_PRS" == true ]] || { echo "::error::Fork PRs disabled"; exit 1; }
          [[ "$TITLE" =~ ^\[(TASK-[0-9]{3,}|GOAL-[0-9]+|CORRECTION-[A-Z0-9-]+|MAINTENANCE|TEMPLATE)\] ]] \
            || { echo "::error::Invalid managed PR title"; exit 1; }

          TASK_ID="${BASH_REMATCH[1]}"
          TASK_ISSUE="$(grep -Eio 'TASK Issue:[[:space:]]*(https://github.com/[^/[:space:]]+/[^/[:space:]]+/issues/)?#?[0-9]+' <<<"$BODY" | grep -Eo '[0-9]+$' | head -1 || true)"
          GOAL_ISSUE="$(grep -Eio 'Goal Issue:[[:space:]]*(https://github.com/[^/[:space:]]+/[^/[:space:]]+/issues/)?#?[0-9]+' <<<"$BODY" | grep -Eo '[0-9]+$' | head -1 || true)"
          NEXT_BODY="$BODY"

          if [[ "$TASK_ID" =~ ^TASK- && -z "$TASK_ISSUE" ]]; then
            TASK_ISSUE="$(gh api "repos/${REPOSITORY}/issues?state=all&per_page=100" --paginate \
              --jq ".[] | select(.pull_request == null) | select((.title | test(\"${TASK_ID}\";\"i\")) or ((.body // \"\") | contains(\"juleswhile:task-id:${TASK_ID}\"))) | .number" | head -1)"
            [[ "$TASK_ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::Canonical TASK Issue not found"; exit 1; }
          fi
          if [[ "$TASK_ID" =~ ^GOAL- && -z "$GOAL_ISSUE" ]]; then GOAL_ISSUE="${TASK_ID#GOAL-}"; fi

          if [[ "$TASK_ID" =~ ^(TASK-|GOAL-) && "$NEXT_BODY" != *"<!-- juleswhile:task-pr -->"* ]]; then
            NEXT_BODY="<!-- juleswhile:task-pr -->\n\n${NEXT_BODY}"
          fi
          if [[ "$TASK_ID" =~ ^TASK- ]] && ! grep -Eqi 'TASK Issue:' <<<"$NEXT_BODY"; then NEXT_BODY="${NEXT_BODY}\n\nTASK Issue: #${TASK_ISSUE}"; fi
          if [[ "$TASK_ID" =~ ^GOAL- ]] && ! grep -Eqi 'Goal Issue:' <<<"$NEXT_BODY"; then NEXT_BODY="${NEXT_BODY}\n\nGoal Issue: #${GOAL_ISSUE}"; fi

          if [[ "$NEXT_BODY" != "$BODY" || "$DRAFT" == true ]]; then
            jq -n --arg body "$NEXT_BODY" '{body:$body,draft:false}' \
              | gh api --method PATCH "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --input - >/dev/null
          fi
          {
            echo "task_id=${TASK_ID}"
            echo "task_issue=${TASK_ISSUE}"
            echo "goal_issue=${GOAL_ISSUE}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Detect scope
        id: scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sed '/^$/d' | sort -u > "${RUNNER_TEMP}/files.txt"
          [[ -s "${RUNNER_TEMP}/files.txt" ]] || { echo "::error::No changed files"; exit 1; }
          CONTROL=false
          while IFS= read -r file; do
            case "$file" in AGENTS.md|.github/*|ops/schemas/*|ops/scripts/*|package.json|package-lock.json|netlify.toml) CONTROL=true;; esac
          done < "${RUNNER_TEMP}/files.txt"
          echo "control_plane=${CONTROL}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: npm

      - name: Run required validation
        env:
          TASK_ID: ${{ steps.meta.outputs.task_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run validate:schemas
          npm run validate:task-graph
          npm run validate:pr-scope -- --task-id "$TASK_ID" --change-list "${RUNNER_TEMP}/files.txt" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          for script in validate:supply-chain lint typecheck test build; do
            jq -e --arg s "$script" '.scripts[$s] | type == "string"' package.json >/dev/null && npm run "$script" || true
          done
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          npx tsx ops/scripts/verify-repository-integrity.ts --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

  publish:
    name: Publish validation result
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Label and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.validate.result }}
          TASK_ID: ${{ needs.validate.outputs.task_id }}
          TASK_ISSUE: ${{ needs.validate.outputs.task_issue }}
          GOAL_ISSUE: ${{ needs.validate.outputs.goal_issue }}
          CONTROL: ${{ needs.validate.outputs.control_plane }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for spec in 'juleswhile:managed|0052CC' 'validation:passed|0E8A16' 'validation:failed|D73A4A' 'risk:control-plane|B60205' 'human-approval-required|D93F0B'; do
            IFS='|' read -r name color <<<"$spec"; gh label create "$name" --repo "$REPOSITORY" --color "$color" --force
          done
          for label in validation:passed validation:failed; do gh api --method DELETE "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/${label}" >/dev/null 2>&1 || true; done
          if [[ "$RESULT" == success ]]; then LABEL=validation:passed; EVENT=pr_validation_passed; else LABEL=validation:failed; EVENT=pr_validation_failed; fi
          jq -n --arg l "$LABEL" '{labels:[$l]}' | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --input - >/dev/null
          if [[ "$CONTROL" == true ]]; then jq -n '{labels:["risk:control-plane","human-approval-required"]}' | gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" --input - >/dev/null; fi
          jq -n --arg event "$EVENT" --arg task "$TASK_ID" --arg task_issue "$TASK_ISSUE" --arg goal_issue "$GOAL_ISSUE" --arg sha "$HEAD_SHA" --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --argjson pr "$PR_NUMBER" \
            '{event_type:$event,client_payload:{pr_number:$pr,task_id:$task,task_issue_number:$task_issue,goal_issue_number:$goal_issue,head_sha:$sha,run_url:$run}}' \
            | gh api --method POST "repos/${REPOSITORY}/dispatches" --input -
          if [[ "$RESULT" != success ]]; then gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "<!-- juleswhile:pr-validation-failed -->

Validation failed for \`${HEAD_SHA}\`. Correction Controller will use this PR branch. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true; fi
