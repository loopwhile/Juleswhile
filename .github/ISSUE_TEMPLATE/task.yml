name: TASK
description: Jules가 실행할 단일 작업을 정의하거나 수동으로 보완합니다.
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        # Juleswhile TASK

        하나의 TASK는 하나의 Jules 세션과 하나의 Pull Request에 대응합니다.

        자동 생성된 TASK는 `ops/tasks/task-index.yaml`이 기준이며,
        이 Issue는 실행 상태와 작업 결과를 추적하는 용도로 사용됩니다.

        TASK에는 반드시 다음 항목이 있어야 합니다.

        - 고유 TASK ID
        - 담당 역할
        - 단일 목표
        - 입력
        - 출력
        - 완료 조건
        - 허용 경로
        - 검증 명령어
        - 선행 TASK

        민감정보를 입력하지 마십시오.

  - type: input
    id: task_id
    attributes:
      label: TASK ID
      description: 프로젝트 전체에서 중복되지 않는 TASK ID를 입력합니다.
      placeholder: 예) TASK-023
    validations:
      required: true

  - type: input
    id: task_title
    attributes:
      label: TASK 제목
      description: 하나의 결과를 나타내는 명확한 제목을 입력합니다.
      placeholder: 예) AI 뉴스 상세 페이지 구현
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: 담당 역할
      description: 이 TASK를 수행할 기본 AI 역할을 선택합니다.
      options:
        - project-planner
        - business-analyst
        - researcher
        - marketer
        - solution-architect
        - ux-designer
        - developer
        - verifier
        - reviewer
        - publisher
        - operations
    validations:
      required: true

  - type: dropdown
    id: task_type
    attributes:
      label: TASK 유형
      options:
        - planning
        - research
        - documentation
        - architecture
        - design
        - implementation
        - testing
        - review
        - content
        - deployment
        - maintenance
        - correction
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 - Critical
        - P1 - High
        - P2 - Normal
        - P3 - Low
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: TASK 목표
      description: 이 TASK 하나에서 달성해야 하는 단일 목표를 작성합니다.
      placeholder: |
        예)
        수집된 AI 뉴스 데이터를 이용해 기사 상세 페이지를 구현한다.

        페이지는 제목, 출처, 발행일, 카테고리, 요약,
        핵심 내용과 원문 링크를 표시해야 한다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 및 필요성
      description: 이 TASK가 필요한 이유와 관련 맥락을 작성합니다.
      placeholder: |
        예)
        기사 목록은 구현되어 있지만 개별 콘텐츠를 읽을 수 있는
        상세 페이지가 없어 사용자 흐름이 완성되지 않았다.
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: 선행 TASK
      description: 먼저 완료되어야 하는 TASK ID를 한 줄에 하나씩 작성합니다. 없으면 `none`을 입력합니다.
      placeholder: |
        TASK-018
        TASK-021
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: 입력 파일 및 참조
      description: 작업에 사용해야 하는 문서, 코드, 스키마, 데이터, Issue를 작성합니다.
      placeholder: |
        docs/02_product/article-page-spec.md
        docs/05_design/article-page-ui.md
        data/schema/article.schema.json
        Issue #12
    validations:
      required: true

  - type: textarea
    id: outputs
    attributes:
      label: 필수 산출물
      description: 생성하거나 수정해야 하는 파일과 결과를 작성합니다.
      placeholder: |
        src/pages/articles/[slug].tsx
        src/components/article/ArticleDetail.tsx
        tests/article-page.spec.ts
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 객관적으로 검증할 수 있는 조건을 체크리스트 형태로 작성합니다.
      placeholder: |
        - [ ] 제목이 표시된다.
        - [ ] 출처와 원문 링크가 표시된다.
        - [ ] 발행일과 카테고리가 표시된다.
        - [ ] 존재하지 않는 slug는 404를 반환한다.
        - [ ] 모바일과 데스크톱을 지원한다.
        - [ ] 필수 테스트와 빌드가 통과한다.
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: 수정 허용 경로
      description: Jules가 수정할 수 있는 경로를 한 줄에 하나씩 작성합니다.
      placeholder: |
        src/pages/articles/**
        src/components/article/**
        tests/article-page.spec.ts
    validations:
      required: true

  - type: textarea
    id: forbidden_paths
    attributes:
      label: 수정 금지 경로
      description: 이번 TASK에서 수정하면 안 되는 경로를 작성합니다.
      placeholder: |
        .github/**
        ops/**
        src/auth/**
        package.json
        netlify.toml
    validations:
      required: false

  - type: textarea
    id: forbidden_actions
    attributes:
      label: 금지 작업
      description: 경로와 무관하게 수행하면 안 되는 작업을 작성합니다.
      placeholder: |
        - 인증 정책 변경
        - 환경 변수 변경
        - 새 외부 의존성 추가
        - 기존 테스트 삭제
        - 데이터 스키마 변경
    validations:
      required: false

  - type: textarea
    id: validation_commands
    attributes:
      label: 필수 검증 명령어
      description: PR 제출 전에 반드시 실행해야 하는 명령어를 순서대로 작성합니다.
      placeholder: |
        npm run lint
        npm run typecheck
        npm test -- article-page
        npm run build
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: 위험 수준
      description: 변경 실패 시 미치는 영향을 기준으로 선택합니다.
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: dropdown
    id: approval_policy
    attributes:
      label: 사람 승인 정책
      options:
        - CI 통과 시 자동 병합 가능
        - Reviewer Agent 승인 필요
        - 사람 승인 필요
        - 실행 전 사람 승인 필요
    validations:
      required: true

  - type: checkboxes
    id: parallel_policy
    attributes:
      label: 병렬 실행 정책
      options:
        - label: 다른 TASK와 파일 충돌 없이 병렬 실행할 수 있습니다.
        - label: 동일 프로젝트의 다른 TASK가 이 작업 결과 없이 진행되어도 안전합니다.
    validations:
      required: false

  - type: textarea
    id: resource_locks
    attributes:
      label: 리소스 잠금
      description: 동시에 다른 TASK가 수정하면 안 되는 논리적 리소스 또는 경로를 작성합니다.
      placeholder: |
        article-page
        src/components/article
    validations:
      required: false

  - type: input
    id: max_corrections
    attributes:
      label: 최대 자동 보완 횟수
      description: CI 실패 시 Jules가 자동 보완할 수 있는 최대 횟수를 입력합니다.
      placeholder: "2"
      value: "2"
    validations:
      required: true

  - type: input
    id: timeout_minutes
    attributes:
      label: 실행 제한 시간
      description: TASK가 RUNNING 상태를 유지할 수 있는 최대 시간을 분 단위로 입력합니다.
      placeholder: "60"
      value: "60"
    validations:
      required: true

  - type: textarea
    id: completion_report
    attributes:
      label: 완료 보고 요구사항
      description: PR에 반드시 포함해야 하는 결과 보고 내용을 작성합니다.
      value: |
        - 변경한 파일
        - 구현 내용
        - 실행한 검증
        - 검증 결과
        - 실행하지 못한 검증
        - 알려진 위험
        - 후속 TASK 제안
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 추가 정보
      description: 구현에 필요한 추가 제약, 예시, 디자인 또는 참고사항을 작성합니다.
      placeholder: |
        예)
        기존 ArticleCard 컴포넌트의 타이포그래피와 간격을 따른다.
        새로운 UI 라이브러리는 추가하지 않는다.
    validations:
      required: false

  - type: checkboxes
    id: task_acknowledgement
    attributes:
      label: TASK 계약 확인
      options:
        - label: 이 Issue는 하나의 독립된 TASK만 포함합니다.
          required: true
        - label: 완료 조건과 필수 산출물을 객관적으로 검증할 수 있습니다.
          required: true
        - label: API Key, Token, 비밀번호 또는 개인정보를 포함하지 않았습니다.
          required: true
        - label: 허용 범위를 벗어난 작업은 별도 TASK로 분리합니다.
          required: true